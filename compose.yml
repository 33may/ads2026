# Scenario 1: one word-count server behind localhost:${SERVER_PORT}.
name: ads

services:

  client:
    build: ./client
    image: ads-client
    container_name: ads-client
    environment:
      ADS_HOST: server-1
      ADS_PORT: ${SERVER_PORT}
    volumes:
      - ./texts:/app/texts:ro
    depends_on:
      server-1:
        condition: service_started

  redis:
    image: redis:7
    container_name: ads-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  minio:
    image: ghcr.io/coollabsio/minio
    container_name: ads-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "19001:9001"          # web console, for inspection only
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 10

  server-1:
    build: ./server
    image: ads-server
    container_name: server-1
    environment:
      SERVER_NAME: server-1
      SERVER_PORT: ${SERVER_PORT}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      REDIS_URL: redis://redis:6379/0
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-64}
      REDIS_POOL_TIMEOUT: ${REDIS_POOL_TIMEOUT:-5}
      CACHE: ${CACHE:-on}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  minio-data:
