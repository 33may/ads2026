# Scenario 2 (Phases 3/4): three replicas behind a balancer on localhost:${SERVER_PORT}.
# Self-contained: never combined with compose.yml. `make down` before switching scenarios.
name: ads

x-server: &server            # one definition, three replicas; only SERVER_NAME differs
  build: ./server
  image: ads-server
  environment: &server-env
    SERVER_PORT: ${SERVER_PORT}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET}
    REDIS_URL: redis://redis:6379/0
    REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-64}
    REDIS_POOL_TIMEOUT: ${REDIS_POOL_TIMEOUT:-5}
    CACHE: ${CACHE:-on}
    FAULT_TOLERANCE: ${FAULT_TOLERANCE:-off}
    SERVER_HEALTH_PORT: ${SERVER_HEALTH_PORT:-18862}
    HEALTH_TIMEOUT: ${HEALTH_TIMEOUT:-0.5}
  depends_on:
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:

  client:
    build: ./client
    image: ads-client
    container_name: ads-client
    environment:
      ADS_HOST: lb
      ADS_PORT: ${SERVER_PORT}
    volumes:
      - ./texts:/app/texts:ro
    depends_on:
      lb:
        condition: service_started

  redis:
    image: redis:7
    container_name: ads-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  minio:
    image: ghcr.io/coollabsio/minio
    container_name: ads-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 10

  server-1:
    <<: *server
    container_name: server-1
    environment:
      <<: *server-env
      SERVER_NAME: server-1

  server-2:
    <<: *server
    container_name: server-2
    environment:
      <<: *server-env
      SERVER_NAME: server-2

  server-3:
    <<: *server
    container_name: server-3
    environment:
      <<: *server-env
      SERVER_NAME: server-3

  lb:                        # Phase 3: byte-level TCP proxy, contents of lb/ by its implementer
    build: ./lb
    image: ads-lb
    container_name: lb
    command: ["--algorithm", "${LB_ALGORITHM:-least-connections}"]
    environment:
      SERVER_PORT: ${SERVER_PORT}
      LB_METRICS_PORT: ${LB_METRICS_PORT:-18860}
      FAULT_TOLERANCE: ${FAULT_TOLERANCE:-off}
      SERVER_HEALTH_PORT: ${SERVER_HEALTH_PORT:-18862}
      HEALTH_INTERVAL: ${HEALTH_INTERVAL:-1}
      HEALTH_TIMEOUT: ${HEALTH_TIMEOUT:-0.5}
      HEALTH_FALL: ${HEALTH_FALL:-2}
      HEALTH_RISE: ${HEALTH_RISE:-2}
      BACKEND_CONNECT_TIMEOUT: ${BACKEND_CONNECT_TIMEOUT:-0.5}
      BACKENDS: server-1:${SERVER_PORT},server-2:${SERVER_PORT},server-3:${SERVER_PORT}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
      - "127.0.0.1:${LB_METRICS_PORT:-18860}:${LB_METRICS_PORT:-18860}"
    depends_on:
      server-1:
        condition: service_started
      server-2:
        condition: service_started
      server-3:
        condition: service_started

volumes:
  minio-data:
